name: Python binding

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  check-ci:
    runs-on: ubuntu-22.04
    outputs:
      abi3: ${{ steps.matrix.outputs.abi3 }}
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install packaging
      - name: Generate build matrices
        id: matrix
        run: python bindings/python/ci/platforms.py
      - run: python -m unittest discover -s bindings/python/ci -p 'test_*.py'
      - run: node --test bindings/python/ci/test_build_status.cjs

  build-abi3:
    needs: check-ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.abi3) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install build and ABI audit tools
        run: python -m pip install 'maturin>=1.14,<2' abi3audit
      - name: Check binding Rust code
        run: |
          cargo fmt -p aliyun-log-producer-python --check
          cargo clippy -p aliyun-log-producer-python --all-targets --no-deps -- -D warnings
      # These are host-platform CI wheels. Portable manylinux/musllinux release
      # wheels require their own build images and native dependency audit.
      - name: Build one ABI3 wheel for this platform
        run: python -m maturin build --release --manifest-path bindings/python/Cargo.toml --interpreter python --compatibility linux --out wheelhouse
      - name: Verify wheel metadata and stable ABI symbols
        run: python bindings/python/ci/check_wheel.py wheelhouse --audit
      - uses: actions/upload-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-and-test:
    needs: [check-ci, build-abi3]
    # A failed ABI3 build must not skip native builds or tests on other hosts.
    if: ${{ !cancelled() && needs.check-ci.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.runtime) }}
    name: build-and-test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tool
        if: matrix.native
        run: python -m pip install 'maturin>=1.14,<2'
      - name: Build a wheel for this Python version
        if: matrix.native
        run: python -m maturin build --release --no-default-features --manifest-path bindings/python/Cargo.toml --interpreter python --compatibility linux --out wheelhouse/native
      - name: Check and install version-specific package
        if: matrix.native
        run: python bindings/python/ci/check_wheel.py wheelhouse/native --kind native --install
      - name: Test version-specific package
        if: matrix.native
        run: python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v4
        if: matrix.native
        with:
          name: python-native-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/native/*.whl
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/abi3
      - name: Install the shared wheel without a source-build fallback
        run: python bindings/python/ci/check_wheel.py wheelhouse/abi3 --install
      - name: Test ABI3 package
        run: python -m pytest bindings/python/tests -q
      - name: Verify wheel selection with pip
        run: python bindings/python/ci/check_selection.py wheelhouse/abi3 ${{ matrix.native && 'wheelhouse/native' || '' }}

  collect-wheels:
    needs: [build-abi3, build-and-test]
    # Preserve available wheels even when another matrix entry failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-abi3-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: python-native-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
