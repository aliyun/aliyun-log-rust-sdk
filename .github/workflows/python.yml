name: Python binding

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  check-ci:
    runs-on: ubuntu-22.04
    outputs:
      abi3: ${{ steps.matrix.outputs.abi3 }}
      runtime: ${{ steps.matrix.outputs.runtime }}
      alternative: ${{ steps.matrix.outputs.alternative }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install packaging
      - name: Generate build matrices
        id: matrix
        run: python bindings/python/ci/platforms.py
      - run: python -m unittest discover -s bindings/python/ci -p 'test_*.py'
      - run: node --test bindings/python/ci/test_build_status.cjs

  build-abi3:
    needs: check-ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.abi3) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install build and ABI audit tools
        run: python -m pip install 'maturin>=1.14,<2' packaging abi3audit
      - name: Check binding Rust code
        run: |
          cargo fmt -p aliyun-log-producer-python --check
          cargo clippy -p aliyun-log-producer-python --all-targets --no-deps -- -D warnings
      # These are host-platform CI wheels. Portable manylinux/musllinux release
      # wheels require their own build images and native dependency audit.
      - name: Build one ABI3 wheel for this platform
        run: python -m maturin build --release --manifest-path bindings/python/Cargo.toml --interpreter python --compatibility linux --out wheelhouse
      - name: Verify wheel metadata and stable ABI symbols
        run: python bindings/python/ci/check_wheel.py wheelhouse --audit
      - uses: actions/upload-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-and-test:
    needs: [check-ci, build-abi3]
    # A failed ABI3 build must not skip native builds or tests on other hosts.
    if: ${{ !cancelled() && needs.check-ci.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.runtime) }}
    name: build-and-test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'macos-15' || (matrix.python != '3.8' && matrix.python != '3.9')
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        if: matrix.os == 'macos-15' && (matrix.python == '3.8' || matrix.python == '3.9')
      - name: Install older macOS ARM64 interpreter
        if: matrix.os == 'macos-15' && (matrix.python == '3.8' || matrix.python == '3.9')
        run: |
          uv venv --python "${{ matrix.python }}" --seed .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install packaging
      - name: Install build tool
        if: matrix.native
        run: python -m pip install 'maturin>=1.14,<2' packaging
      - name: Build a wheel for this Python version
        if: matrix.native
        run: python -m maturin build --release --no-default-features --manifest-path bindings/python/Cargo.toml --interpreter python --compatibility linux --out wheelhouse/native
      - name: Check and install version-specific package
        if: matrix.native
        run: python bindings/python/ci/check_wheel.py wheelhouse/native --kind native --install
      - name: Test version-specific package
        if: matrix.native
        run: python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v4
        if: matrix.native
        with:
          name: python-native-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/native/*.whl
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: python-abi3-${{ matrix.os }}
          path: wheelhouse/abi3
      - name: Install the shared wheel without a source-build fallback
        run: python bindings/python/ci/check_wheel.py wheelhouse/abi3 --install
      - name: Test ABI3 package
        run: python -m pytest bindings/python/tests -q
      - name: Verify wheel selection with pip
        run: python bindings/python/ci/check_selection.py wheelhouse/abi3 ${{ matrix.native && 'wheelhouse/native' || '' }}

  alternative-runtimes:
    needs: check-ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-ci.outputs.alternative) }}
    name: runtime (${{ matrix.os }}, ${{ matrix.kind }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.setup_python }}
      - uses: dtolnay/rust-toolchain@stable
      # Build tooling runs on CPython; maturin receives the target interpreter.
      # This avoids requiring a maturin wheel for the alternate runtime itself.
      - name: Record target interpreter
        shell: bash
        run: echo "TARGET_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install maturin==1.15.0
      - name: Build runtime wheel
        shell: bash
        run: python -m maturin build --release --no-default-features --manifest-path bindings/python/Cargo.toml --interpreter "$TARGET_PYTHON" --compatibility linux --out wheelhouse/runtime
      - name: Verify, install and test runtime wheel
        shell: bash
        run: |
          "$TARGET_PYTHON" -m pip install packaging
          "$TARGET_PYTHON" bindings/python/ci/check_wheel.py wheelhouse/runtime --kind "${{ matrix.kind }}" --install
          "$TARGET_PYTHON" -m pytest bindings/python/tests -q
          "$TARGET_PYTHON" bindings/python/ci/check_selection.py wheelhouse/runtime --kind "${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-runtime-${{ matrix.os }}-${{ matrix.kind }}-${{ matrix.python }}
          path: wheelhouse/runtime/*.whl
          if-no-files-found: ignore

  collect-wheels:
    needs: [build-abi3, build-and-test, alternative-runtimes]
    # Preserve available wheels even when another matrix entry failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-abi3-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: python-native-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: python-runtime-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
