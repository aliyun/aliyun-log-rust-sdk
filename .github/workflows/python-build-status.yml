name: Python platform build status

on:
  workflow_run:
    workflows: ["Python Release"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: python-build-status
  cancel-in-progress: false

jobs:
  badges:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      # workflow_run has write access: execute only trusted default-branch code,
      # never scripts or artifacts from the triggering build's checkout.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Read expected builds from the release matrix
        run: python bindings/python/ci/release.py status-targets > "$RUNNER_TEMP/python-status-targets.json"
      - name: Publish per-platform badges
        uses: actions/github-script@v7
        with:
          script: |
            const targets = require(`${process.env.RUNNER_TEMP}/python-status-targets.json`);
            const { publish } = require('./bindings/python/ci/build_status.cjs');
            await publish({ github, context, core, targets });
