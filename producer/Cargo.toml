[package]
name = "aliyun-log-producer"
version = "0.1.1"
edition = "2021"
authors = ["Aliyun Log Service"]
description = "Thread-safe asynchronous batching producer for Alibaba Cloud Simple Log Service"
license = "MIT"
repository = "https://github.com/aliyun/aliyun-log-rust-sdk/tree/master/producer"
readme = "README.md"

[dependencies]
aliyun-log-rust-sdk = { version = "0.3.2", path = "../client" }
aliyun-log-sdk-protobuf = { version = "0.1.2", path = "../protobuf" }
async-trait = "0.1"
bytes = "1.11.1"
fastrand = "2"
flume = "0.11"
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
futures-util = "0.3"
lz4 = "1"
zstd = { version = "0.13", default-features = false }
rayon = "1.10"
tokio-rayon = "2.1"
thiserror = "2"
tokio = { version = "1.44", features = ["rt", "sync", "time", "net", "macros"] }
log = "0.4"
metrics = "0.24"
tokio-util = { version = "0.7", features = ["time"] }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
quick-protobuf = "0.8"
tokio = { version = "1.44", features = ["full", "test-util"] }
