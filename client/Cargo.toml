[package]
name = "aliyun-log-rust-sdk"
version = "0.3.0"
edition = "2021"
authors = ["Aliyun Log Service"]
homepage = "https://github.com/aliyun/aliyun-log-rust-sdk/tree/master/client"
repository = "https://github.com/aliyun/aliyun-log-rust-sdk/tree/master/client"
documentation = "https://docs.rs/aliyun-log-rust-sdk"
keywords = ["aliyun", "sls", "sdk", "log"]
autobenches = false
description = "Rust sdk for Aliyun Log Service"
license = "MIT"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
aliyun-log-sdk-protobuf = { version = "0.1.1", path = "../protobuf" }
aliyun-log-sdk-sign = { version = "0.2.1", path = "../sign" }
thiserror = "2.0.20"
anyhow = "1.0.104"
http = "1.5.0"
httpdate = "1.0.3"
lz4 = "1.28.1"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
getset = "0.1.7"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
log = "0.4.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.1"

[lib]

[dev-dependencies]
chrono = "0.4.45"
dotenv = "0.15.0"
env_logger = "0.11.11"
envy = "0.4.2"
log = "0.4.34"
lazy_static = "1.5.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-test = "0.4.5"
