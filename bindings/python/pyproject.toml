[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "aliyun-log-producer"
dynamic = ["version"]
description = "Python bindings for the Alibaba Cloud SLS Rust producer"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: GraalPy",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/aliyun/aliyun-log-rust-sdk/tree/master/bindings/python"
Issues = "https://github.com/aliyun/aliyun-log-rust-sdk/issues"

[project.optional-dependencies]
test = ["packaging>=23", "pytest>=8", "pytest-timeout>=2", "zstandard>=0.23", "lz4>=4"]

[tool.maturin]
python-source = "python"
module-name = "aliyun_log_producer._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 20
timeout_method = "thread"
